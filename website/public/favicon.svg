<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="macBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0051C7" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- macOS App Icon Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#macBg)" filter="url(#subtleShadow)" />
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Dual Split Panes Symbolizing Two Active Directories -->
  <!-- Left Pane -->
  <rect x="96" y="128" width="144" height="256" rx="14" fill="#FFFFFF" fill-opacity="0.95" />
  <rect x="112" y="152" width="56" height="8" rx="4" fill="#0A84FF" />
  <rect x="112" y="176" width="112" height="12" rx="4" fill="#E2E8F0" />
  <rect x="112" y="200" width="88" height="12" rx="4" fill="#E2E8F0" />
  <rect x="112" y="224" width="104" height="12" rx="4" fill="#E2E8F0" />
  <rect x="112" y="248" width="80" height="12" rx="4" fill="#E2E8F0" />

  <!-- Right Pane -->
  <rect x="272" y="128" width="144" height="256" rx="14" fill="#FFFFFF" fill-opacity="0.95" />
  <rect x="288" y="152" width="64" height="8" rx="4" fill="#34C759" />
  <rect x="288" y="176" width="104" height="12" rx="4" fill="#E2E8F0" />
  <rect x="288" y="200" width="112" height="12" rx="4" fill="#E2E8F0" />
  <rect x="288" y="224" width="76" height="12" rx="4" fill="#E2E8F0" />
  <rect x="288" y="248" width="96" height="12" rx="4" fill="#E2E8F0" />

  <!-- Central Move Arrow Connector -->
  <circle cx="256" cy="256" r="22" fill="#0A84FF" filter="url(#subtleShadow)" />
  <path d="M248 248 L262 256 L248 264" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
